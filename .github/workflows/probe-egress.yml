name: probe-egress

# Probe run #1 (2026-10-11).  Purpose: establish, inside a GitHub-hosted runner, which of the
# official data hosts this project depends on are reachable, and record the byte counts and
# SHA-256 of anything fetched.  Nothing here writes a submission artifact.
#
# Official sources probed (public domain / open licence):
#   * USGS 3DEP 1/3 arc-second seamless DEM staged products (the competition's own
#     `1m_DEM_links.csv` family; the 1/3 arc-second product is the 10 m DEM used by the lane)
#     https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n39w119/USGS_13_n39w119.tif
#   * USGS 3DEP 1 arc-second (30 m) staged products
#     https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/n39w119/USGS_1_n39w119.tif
#   * USGS ScienceBase (GeoDAWN catalog item)
#   * pypi (for the scientific stack)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-egress.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: runner facts
        run: |
          set -x
          python3 -V
          nproc
          free -g | head -2
          df -h / | tail -1
          uname -a

      - name: probe official data hosts (HEAD only)
        run: |
          set -x
          for url in \
            "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n39w119/USGS_13_n39w119.tif" \
            "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/1/TIFF/current/n39w119/USGS_1_n39w119.tif" \
            "https://www.sciencebase.gov/catalog/item/657e1d85d34e23d3533209f7" \
            "https://tnmaccess.nationalmap.gov/api/v1/products?datasets=National%20Elevation%20Dataset%20(NED)%201%20arc-second&bbox=-120,39,-119,40&outputFormat=JSON" ; do
            echo "=== $url"
            curl -sSI -m 60 "$url" | head -12 || echo "FAILED $url"
            echo
          done

      - name: download one 1/3 arc-second tile and pin its hash (no artifact stored)
        run: |
          set -e
          URL="https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n39w119/USGS_13_n39w119.tif"
          time curl -sS -m 900 -o tile.tif "$URL"
          ls -l tile.tif
          sha256sum tile.tif
          python3 -m pip install --quiet --no-input "numpy==2.*" rasterio
          python3 - <<'PY'
          import rasterio, numpy as np
          with rasterio.open("tile.tif") as ds:
              print("shape", ds.height, ds.width, "dtype", ds.dtypes[0], "crs", ds.crs,
                    "nodata", ds.nodata, "cell", ds.transform.a)
              a = ds.read(1, out_shape=(1, 512, 512))
              print("subsample stats", float(a.min()), float(a.max()), float(a.mean()))
          PY

      - name: free space before finishing
        if: always()
        run: rm -f tile.tif
