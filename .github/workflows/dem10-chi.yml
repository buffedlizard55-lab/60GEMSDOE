# H65-1 (executes H62-5): the tectonic-geomorphology lane at native USGS 3DEP 10 m.
#
# The development sandbox cannot reach prd-tnm.s3.amazonaws.com (IR-60-DATA-01); a GitHub-hosted
# runner can (evidence/probe-egress-receipt.json, run 38103732408: HTTP 200 + tile sha256 pin).
# This workflow tiles the 3730 x 3292 competition grid into 6 x 6 blocks, runs the 10 m channel
# network for each block with an 8 km halo, reduces it to the 100 m grid, merges, and COMMITS the
# three compact rasters + a provenance manifest back to the branch that triggered it.  The commit
# in git is the observation channel (Actions artifacts are served from a host outside the
# sandbox allow-list).
#
# Official source (public domain): USGS 3DEP 1/3 arc-second DEM, current 1x1 degree tiles
#   https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/nYYwXXX/USGS_13_nYYwXXX.tif
#   landing page: https://www.usgs.gov/3d-elevation-program
name: dem10-chi

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dem10-chi.yml'

permissions:
  contents: write

concurrency:
  group: dem10-chi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  block:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        by: [0, 1, 2, 3, 4, 5]
        bx: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            data/official
      - name: runner facts
        run: python3 -V; nproc; free -m | head -2; df -h / | tail -1
      - name: install
        run: python3 -m pip install --quiet --no-input numpy scipy numba rasterio pyproj
      - name: block ${{ matrix.by }}-${{ matrix.bx }}
        run: |
          /usr/bin/time -v python3 scripts/dem10_block.py --by ${{ matrix.by }} --bx ${{ matrix.bx }} \
            --nby 6 --nbx 6 --halo 80 --out out/dem10 2> >(tee /tmp/time.txt >&2)
          grep -E "Maximum resident|Elapsed" /tmp/time.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: block-${{ matrix.by }}-${{ matrix.bx }}
          path: out/dem10/
          retention-days: 7

  merge:
    needs: block
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src
            scripts
            data/official
            data/external
      - name: install
        run: python3 -m pip install --quiet --no-input numpy rasterio
      - uses: actions/download-artifact@v4
        with:
          pattern: block-*
          path: blocks
      - name: merge
        run: python3 scripts/dem10_merge.py --blocks blocks --out data/external
      - name: commit the rasters and the manifest back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/external/dem10_chi_100m_i16.tif data/external/dem10_chi_100m_sig_i32.tif \
                     data/external/dem10_chi_100m_u8.tif data/external/dem10_chi_100m.manifest.json
          git commit -m "H65-1 dem10-chi features (run $GITHUB_RUN_ID) [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done
