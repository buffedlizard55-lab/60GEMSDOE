[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems60"
version = "0.1.0"
description = "60GEMSDOE: tectonic-geomorphology lane (chi, ksn, knickpoints) for the DOE GEMS Prize Challenge"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
